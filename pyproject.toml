[project]
name = "caps-backend"
version = "0.1.0"
description = "PM2.5 & AOD Jakarta Backend API"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "scalar-fastapi>=1.0.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    # Database
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.15.0",
    "alembic>=1.14.0",
    # Config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Scheduler
    "apscheduler>=3.10.0",
    # Geo & spatial
    "shapely>=2.0.0",
    "geopandas>=1.0.1",
    "rasterio>=1.3.0",
    "rioxarray>=0.17.0",
    # Data processing
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "xarray>=2024.0.0",
    "netcdf4>=1.7.0",
    "scipy>=1.13.0",
    # ML
    "scikit-learn>=1.4.0",
    "tensorflow>=2.16.0",
    # HTTP / scraping
    "requests>=2.32.0",
    "beautifulsoup4>=4.13.0",
    "httpx>=0.28.1",
    "asyncpg>=0.31.0",
    "fastapi-cache2[redis]>=0.2.2",
    "redis>=4.6.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ASYNC", "S", "B", "A", "C4", "DTZ", "T20", "RET", "SIM", "ARG", "PTH", "ERA", "PL", "RUF"]
ignore = ["B008", "N802", "PLR2004", "S101", "S105", "S321", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
