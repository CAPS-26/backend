services:
  db:
    image: kartoza/postgis:16-3.4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${NAMEDB}
      POSTGRES_USER: ${USERDB}
      POSTGRES_PASS: ${PASSDB}
      ALLOW_IP_RANGE: 0.0.0.0/0
    volumes:
      - ./deploy/postgres_data:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${USERDB} -d ${NAMEDB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - backend_net

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      DBHOST: db
      DBPORT: "5432"
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Jakarta}
      TZ: Asia/Jakarta
      PYTHONPATH: /app
      API_KEY: ${API_KEY}
      RUN_MIGRATIONS: "true"
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: ["true"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DBHOST: db
      DBPORT: "5432"
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Jakarta}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      TZ: Asia/Jakarta
      PYTHONPATH: /app
    ports:
      - "${API_PORT:-1963}:1963"
    volumes:
      - ./media:/app/media
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: ["gunicorn", "main:app", "--worker-class", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:1963", "--workers", "2", "--timeout", "120"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:1963/')\" "]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - ./deploy/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_net
      start_period: 15s
    networks:
      - backend_net

  arq_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DBHOST: db
      DBPORT: "5432"
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Jakarta
      PYTHONPATH: /app
    command: ["arq", "apps.core.arq_app.WorkerSettings"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge
