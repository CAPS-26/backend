services:
  db:
    image: kartoza/postgis:16-3.4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${NAMEDB:-aodproject}
      POSTGRES_USER: ${USERDB:-aoduser}
      POSTGRES_PASSWORD: ${PASSDB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    command: 
      - postgres
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_min_messages=error
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${USERDB:-aoduser} -d ${NAMEDB:-aodproject}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          memory: 768M

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      DBHOST: db
      DBPORT: "5432"
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Jakarta}
      TZ: Asia/Jakarta
      PYTHONPATH: /app
      API_KEY: ${API_KEY}
      RUN_MIGRATIONS: "true"
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: ["true"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DBHOST: db
      DBPORT: "5432"
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Jakarta}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      TZ: Asia/Jakarta
      PYTHONPATH: /app
    ports:
      - "${API_PORT:-1963}:1963"
    volumes:
      - media_data:/app/media
      - satellite_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: ["gunicorn", "main:app", "--worker-class", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:1963", "--workers", "2", "--timeout", "120"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:1963/')\" "]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 300mb
      - --maxmemory-policy
      - allkeys-lru
      - --loglevel
      - warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          memory: 384M

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DBHOST: db
      DBPORT: "5432"
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Jakarta
      PYTHONPATH: /app
    command: ["celery", "-A", "apps.core.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - satellite_data:/app/data
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          memory: 1200M

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Jakarta
      PYTHONPATH: /app
    command: ["celery", "-A", "apps.core.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  media_data:
  satellite_data:
  redis_data:

networks:
  backend_net:
    driver: bridge
